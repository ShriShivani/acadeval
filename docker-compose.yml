# ─────────────────────────────────────────────────────────────────────────────
# AcadEval+ — Local Development Services
# Usage:
#   Start all:      docker compose up -d
#   Stop all:       docker compose down
#   Logs (neo4j):   docker compose logs -f neo4j
#   Logs (redis):   docker compose logs -f redis
#
# Neo4j browser UI:  http://localhost:7474  (neo4j / acadeval_password)
# Redis CLI:         docker exec -it acadeval_redis redis-cli
# ─────────────────────────────────────────────────────────────────────────────

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: acadeval_neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/acadeval_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "256m"
      NEO4J_dbms_memory_heap_max__size: "512m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "acadeval_password", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: acadeval_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grobid:
    image: grobid/grobid:0.8.0
    container_name: acadeval_grobid
    restart: always
    ports:
      - "8070:8070"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
